name: 🚀 Deploy to Inspira Stage

on:
  # 🔹 Trigger deployment on pushes to stage-desk branch
  push:
    branches:
      - stage-desk
    paths-ignore:
      - README.md
      - .github/**
      - docs/**
      - "*.md"

  # 🔹 Allow manual trigger via GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Stage Server
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Prepare SSH access
      - name: 🔐 Setup SSH Access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "145.223.35.233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBk..." >> ~/.ssh/known_hosts

      # 3️⃣ Deploy files via rsync (excluding unnecessary ones)
      - name: 📦 Sync code to Inspira Stage
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --exclude-from='deploy-exclude.txt'
          path: ./
          remote_path: /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env/
          remote_host: 145.223.35.233
          remote_port: 65002
          remote_user: u296731902
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 4️⃣ Run Laravel & Botble build + cache optimization remotely
      - name: ⚙️ Run Laravel + Build setup on Stage server
        run: |
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no u296731902@145.223.35.233 <<'EOF'
            cd /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env

            echo "📦 Installing composer dependencies..."
            composer install --no-dev --optimize-autoloader --quiet

            echo "🧱 Building frontend assets..."
            if [ -f package.json ]; then
              yarn install --frozen-lockfile --silent || npm install --silent
              yarn build || npm run build
            fi

            echo "🧹 Clearing all Laravel caches..."
            php artisan optimize:clear
            php artisan view:clear
            php artisan config:clear
            php artisan route:clear
            php artisan cache:clear

            echo "🧩 Rebuilding Botble plugin & theme caches..."
            rm -f bootstrap/cache/plugins.php
            php artisan cms:cache:clear
            php artisan cms:theme:assets:publish

            echo "⚙️ Rebuilding optimized caches..."
            php artisan config:cache
            php artisan view:cache
            php artisan route:cache

            echo "✅ Inspira STAGE deployment completed successfully!"
          EOF

      # 5️⃣ Notify success
      - name: 📨 Notify success
        run: echo "✅ Inspira Stage deployed from commit ${{ github.sha }} at $(date)"
