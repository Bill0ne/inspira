name: 🚀 Deploy to Inspira Stage

on:
  push:
    branches:
      - stage-desk
    paths-ignore:
      - README.md
      - .github/**
      - docs/**
      - "*.md"

jobs:
  deploy:
    name: Deploy to Stage Server
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repository auschecken
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ SSH vorbereiten
      - name: 🔐 Setup SSH Access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Fingerprint manuell speichern (höchste Sicherheit)
          echo "145.223.35.233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBk..." >> ~/.ssh/known_hosts

      # 3️⃣ Rsync Deployment (Safe Mode)
      - name: 📦 Sync code to Inspira Stage
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --exclude-from='deploy-exclude.txt'
          path: ./
          remote_path: /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env/
          remote_host: 145.223.35.233
          remote_port: 65002
          remote_user: u296731902
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 4️⃣ Composer & Laravel Tasks
      - name: ⚙️ Run Laravel setup on server
        run: |
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no u296731902@145.223.35.233 <<'EOF'
          cd /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env

          echo "📦 Running composer install..."
          composer install --no-dev --optimize-autoloader --quiet

          echo "🧹 Clearing and caching Laravel..."
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:clear

          echo "✅ Inspira Stage deployment completed successfully!"
          EOF

      # 5️⃣ Optional: Notify
      - name: 📨 Notify success
        run: echo "✅ Inspira Stage deployed at $(date)"
