name: 🚀 Deploy to Inspira Stage

on:
  # 🔹 Automatisch bei Push auf irgendeinen Branch (wir filtern später per if)
  push:
    branches:
      - "UI-ButNot"
    paths-ignore:
      - README.md
      - .github/**
      - docs/**
      - "*.md"

  # 🔹 Optional: manuell starten über GitHub Actions → "Run workflow"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Stage Server
    runs-on: ubuntu-latest

    # 🔹 Nur ausführen, wenn der Push von stage-desk kommt
    if: github.ref == 'refs/heads/stage-desk'

    steps:
      # 1️⃣ Repository auschecken
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ SSH vorbereiten
      - name: 🔐 Setup SSH Access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Fingerprint speichern (sicher)
          echo "145.223.35.233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBk..." >> ~/.ssh/known_hosts

      # 3️⃣ Rsync Deployment (Safe Mode)
      - name: 📦 Sync code to Inspira Stage
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --exclude-from='deploy-exclude.txt'
          path: ./                    # Lokaler Pfad
          remote_path: /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env/
          remote_host: 145.223.35.233
          remote_port: 65002
          remote_user: u296731902
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 4️⃣ Composer & Laravel Setup auf dem Server
      - name: ⚙️ Run Laravel setup on server
        run: |
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no u296731902@145.223.35.233 <<'EOF'
          cd /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env
          echo "📦 Running composer install..."
          composer install --no-dev --optimize-autoloader --quiet
          echo "🧹 Optimizing Laravel..."
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:clear
          echo "✅ Inspira Stage deployment completed successfully!"
          EOF

      # 5️⃣ Optional: Notify success
      - name: 📨 Notify success
        run: echo "✅ Inspira Stage deployed automatically from ${{ github.ref_name }} at $(date)"
