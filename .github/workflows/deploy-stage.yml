name: Deployment To Inspira Stage

on:
  push:
  workflow_dispatch:

jobs:
  deploy_stage:
    name: Deploy on Stage
    runs-on: ubuntu-latest
    if: success() && contains(github.ref,'refs/heads/stage-desk')
    steps:
      - name: Deploy on Stage via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env
            eval `ssh-agent -s`
            ssh-add - <<< '${{ secrets.SSH_KEY }}'
            git pull origin stage-desk
            composer install --no-dev --optimize-autoloader
            yarn install --frozen-lockfile
            yarn build
            php artisan migrate --force
            echo "✅ Stage deployed successfully!"
