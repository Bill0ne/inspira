name: 🚀 Inspira Deploy (Stage + Live)

on:
  # 🔹 Auf jeden Push / Commit hören – egal welcher Branch
  push:
    branches:
      - "*"
    paths-ignore:
      - README.md
      - .github/**
      - docs/**
      - "*.md"

  # 🔹 Optional: manuell startbar über Actions → "Run workflow"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 🔹 Job läuft nur, wenn Branch entweder stage-desk oder main-desk ist
    if: contains(fromJson('["refs/heads/stage-desk","refs/heads/main-desk"]'), github.ref)

    steps:
      # 1️⃣ Repository auschecken
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ SSH vorbereiten
      - name: 🔐 Setup SSH Access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "145.223.35.233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBk..." >> ~/.ssh/known_hosts

      # 3️⃣ Dynamischer Pfad & Name je nach Branch
      - name: ⚙️ Set environment variables
        id: set-env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "stage-desk" ]]; then
            echo "DEPLOY_PATH=/home/u296731902/domains/inspira-zentrum.de/public_html/stage-env/" >> $GITHUB_ENV
            echo "DEPLOY_NAME=Stage" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "main-desk" ]]; then
            echo "DEPLOY_PATH=/home/u296731902/domains/inspira-zentrum.de/public_html/" >> $GITHUB_ENV
            echo "DEPLOY_NAME=Live" >> $GITHUB_ENV
          fi

      # 4️⃣ Rsync Deployment
      - name: 📦 Sync code to ${{ env.DEPLOY_NAME }}
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --exclude-from='deploy-exclude.txt'
          path: ./
          remote_path: ${{ env.DEPLOY_PATH }}
          remote_host: 145.223.35.233
          remote_port: 65002
          remote_user: u296731902
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 5️⃣ Composer & Laravel Commands
      - name: 🧹 Run Laravel setup on server
        run: |
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no u296731902@145.223.35.233 <<'EOF'
          if [[ "${GITHUB_REF_NAME}" == "stage-desk" ]]; then
            cd /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env
          else
            cd /home/u296731902/domains/inspira-zentrum.de/public_html
          fi

          echo "📦 Running composer install..."
          composer install --no-dev --optimize-autoloader --quiet
          echo "🧹 Optimizing Laravel..."
          php artisan migrate --force || true
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:clear
          echo "✅ Inspira ${{ env.DEPLOY_NAME }} deployment completed successfully!"
          EOF

      # 6️⃣ Notify
      - name: 📨 Notify success
        run: echo "✅ Inspira ${{ env.DEPLOY_NAME }} deployed from branch '${{ github.ref_name }}' at $(date)"
