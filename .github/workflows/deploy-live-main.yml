name: 🚀 Deploy to Inspira Live

on:
  push:
    branches:
      - main-desk
    paths-ignore:
      - README.md
      - .github/**
      - docs/**
      - "*.md"

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "145.223.35.233 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBk..." >> ~/.ssh/known_hosts

      - name: 📦 Sync code to Inspira Live
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --exclude-from='deploy-exclude.txt'
          path: ./
          remote_path: /home/u296731902/domains/inspira-zentrum.de/public_html/
          remote_host: 145.223.35.233
          remote_port: 65002
          remote_user: u296731902
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ⚙️ Run Laravel setup on server
        run: |
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no u296731902@145.223.35.233 <<'EOF'
          cd /home/u296731902/domains/inspira-zentrum.de/public_html
          composer install --no-dev --optimize-autoloader --quiet
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:clear
          echo "✅ Inspira Live deployment completed successfully!"
          EOF

      - name: 📨 Notify success
        run: echo "✅ Inspira Live deployed successfully at $(date)"
