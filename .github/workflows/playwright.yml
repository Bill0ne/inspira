name: 🚀 Run Playwright Design

on:
  workflow_dispatch:

jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest

    steps:
      # === 1️⃣ Checkout Repository (Meta Info only)
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # === 2️⃣ SSH: Run Tests on Remote Server ===
      - name: 🧪 Run Playwright Tests on Hostinger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.INSPIRA_SSH_KEY }}
          REMOTE_USER: ${{ secrets.INSPIRA_USER }}
          REMOTE_HOST: ${{ secrets.INSPIRA_HOST }}
        run: |
          echo "🔐 Setting up SSH access..."
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST << 'EOF'
            cd /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env/tests/e2e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 18
            echo "🧩 Running Playwright tests..."
            npx playwright test --reporter=json > test-results/results.json
            mkdir -p /home/u296731902/domains/inspira-zentrum.de/public_html/dev-test-repo/reports/$(date +"%Y%m%d-%H%M%S")
            cp -r test-results/* /home/u296731902/domains/inspira-zentrum.de/public_html/dev-test-repo/reports/$(date +"%Y%m%d-%H%M%S")/
          EOF

      # === 3️⃣ Notification ===
      - name: ✅ Notify Success
        if: success()
        run: echo "✅ Inspira E2E Tests executed successfully on Hostinger!"

      - name: ❌ Notify Failure
        if: failure()
        run: echo "❌ Inspira E2E Tests failed! Check logs on Hostinger server."
