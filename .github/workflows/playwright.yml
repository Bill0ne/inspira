name: 🚀 Run Playwright E2E TestsD2

on:
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      # === 1️⃣ Repository Checkout ===
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # === 2️⃣ Node.js Setup ===
      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # === 3️⃣ Install Playwright ===
      - name: 🧪 Install Playwright
        run: |
          cd tests/e2e
          echo "📦 Installing dependencies..."
          npm install
          echo "🎭 Installing Playwright browsers..."
          npx playwright install --with-deps || npx playwright install chromium
          chmod +x ./node_modules/.bin/playwright

      # === 4️⃣ Run Playwright Tests ===
      - name: 🧩 Run Playwright tests
        run: |
          cd tests/e2e
          mkdir -p ../../reports/${{ github.run_id }}
          echo "🧪 Running Playwright tests..."
          npx playwright test --reporter=json > ../../reports/${{ github.run_id }}/results.json
        continue-on-error: true

      # === 5️⃣ Prepare Report Folder ===
      - name: 📦 Prepare report folder
        run: |
          mkdir -p reports/${{ github.run_id }}
          echo "Preparing report folder for upload..."
          ls -R reports/${{ github.run_id }} || echo "⚠️ No report files found."

      # === 6️⃣ Upload Reports to Inspira Server ===
      - name: 📤 Upload reports to Inspira Server
        if: always()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.INSPIRA_SSH_KEY }}
          REMOTE_USER: ${{ secrets.INSPIRA_USER }}
          REMOTE_HOST: ${{ secrets.INSPIRA_HOST }}
        run: |
          echo "🔐 Setting up SSH credentials..."
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "📡 Uploading report to Inspira dev-test-repo..."
          if [ -d "reports" ]; then
            rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
              reports/ $REMOTE_USER@$REMOTE_HOST:/home/u296731902/domains/inspira-zentrum.de/public_html/dev-test-repo/reports/
            echo "✅ Upload completed."
          else
            echo "⚠️ Kein 'reports'-Ordner gefunden. Upload übersprungen."
          fi

      # === 7️⃣ Notify Result ===
      - name: 🔔 Notify success
        if: success()
        run: echo "✅ Playwright E2E Tests erfolgreich abgeschlossen!"

      - name: ❌ Notify failure
        if: failure()
        run: echo "❌ Playwright E2E Tests sind fehlgeschlagen."
