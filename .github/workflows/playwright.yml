name: 🚀 Playwright Tests (Inspira)

on:
  workflow_dispatch:
  push:
    branches:
      - stage-desk
      - main-desk

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    name: 🧪 Run Playwright E2E Tests

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: ⚙️ Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps

      - name: 🧪 Run Playwright tests
        id: run
        working-directory: tests/e2e
        continue-on-error: true
        run: |
          mkdir -p artifacts
          npx playwright test --reporter=json || true
          mv playwright-report.json artifacts/results.json || true

      - name: 🗂️ Prepare report folder
        id: prep
        run: echo "run_id=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: 🚀 Upload reports to Inspira Server
        if: success() || always()
        run: |
          rsync -avz \
            tests/e2e/artifacts/results.json \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/inspira-zentrum.de/public_html/dev-test-repo/reports/${{ steps.prep.outputs.run_id }}/ \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ${{ secrets.SSH_KEY_PATH }}"
        env:
          SSH_KEY_PATH: ${{ secrets.SSH_KEY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: ✅ Notify success
        if: always()
        run: echo "✅ Playwright pipeline completed successfully – JSON uploaded to Inspira."
