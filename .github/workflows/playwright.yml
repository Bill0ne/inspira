name: 🚀 Run Playwright Stage

on:
  workflow_dispatch:

jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest

    steps:
      # === 1️⃣ Checkout Repository ===
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # === 2️⃣ Run Playwright Tests on Hostinger ===
      - name: 🧪 Run Playwright Tests on Hostinger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "🔐 Setting up SSH access..."
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          echo "🚀 Connecting to Hostinger..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa u296731902@fr-int-web1583.hostinger.net bash << 'EOF'
            cd /home/u296731902/domains/inspira-zentrum.de/public_html/stage-env/tests/e2e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 18
            echo "🧩 Running Playwright tests..."
            npx playwright test --reporter=json > test-results/results.json
            TARGET_DIR="/home/u296731902/domains/inspira-zentrum.de/public_html/dev-test-repo/reports/$(date +'%Y%m%d-%H%M%S')"
            mkdir -p "$TARGET_DIR"
            cp -r test-results/* "$TARGET_DIR/"
            echo "✅ Reports copied to $TARGET_DIR"
          EOF

      # === 3️⃣ Notifications ===
      - name: ✅ Notify Success
        if: success()
        run: echo "✅ Inspira E2E Tests executed successfully on Hostinger!"

      - name: ❌ Notify Failure
        if: failure()
        run: echo "❌ Inspira E2E Tests failed! Check logs on Hostinger server."
