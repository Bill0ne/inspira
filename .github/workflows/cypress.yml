name: 🚀 Cypress Tests (Inspira)

on:
  workflow_dispatch:   # manuell startbar
  push:
    branches:
      - stage-desk     # automatisch bei Push/Commit auf Stage

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]   # 2 parallele Test-Instanzen

    steps:
      # 1️⃣ Repository auschecken
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node.js Setup
      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Dependencies installieren (Fehlerresistent + Lockfile erzeugen)
      - name: 📦 Install dependencies (force legacy)
        run: |
          echo "🧰 Preparing NPM environment..."
          npm config set legacy-peer-deps true
          npm config set strict-ssl false
          npm config set fund false
          npm config set audit false
          echo "📄 Generating package-lock.json if missing..."
          if [ ! -f package-lock.json ]; then npm install --package-lock-only; fi
          echo "📦 Installing dependencies..."
          npm install --force --legacy-peer-deps --ignore-scripts --no-audit --no-fund --ignore-engines || true
          echo "🔍 Verifying Cypress..."
          npx cypress verify || true

      # 4️⃣ Cypress Tests auf Stage laufen lassen
      - name: 🧪 Run Cypress tests on Stage
        uses: cypress-io/github-action@v6
        with:
          record: true
          parallel: true
          browser: chrome
          config: baseUrl=https://stage.inspira-zentrum.de
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5️⃣ Ergebnis ausgeben
      - name: 📨 Notify success
        run: echo "✅ Cypress Tests completed successfully at $(date)"
