name: 🚀 Cypress Tests (Inspira)

on:
  workflow_dispatch:   # manuell startbar
  push:
    branches:
      - stage-desk     # optional automatisch auf stage

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]   # 2 parallele Test-Instanzen

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies (safe mode)
        run: |
          npm ci --legacy-peer-deps --ignore-engines --no-audit || npm install --legacy-peer-deps --ignore-engines --no-audit --force
          npx cypress verify

      - name: 🧪 Run Cypress tests on Stage
        uses: cypress-io/github-action@v6
        with:
          record: true
          parallel: true
          browser: chrome
          config: baseUrl=https://stage.inspira-zentrum.de
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
