name: 🚀 Cypress Tests (Inspira)

on:
  workflow_dispatch:
  push:
    branches:
      - stage-desk
    paths-ignore:
      - README.md
      - .github/**
      - docs/**
      - "*.md"

jobs:
  cypress-run:
    name: Run Cypress E2E tests on Stage
    runs-on: ubuntu-latest

    steps:
      # 1) Code auschecken
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2) Node bereitstellen
      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3) ALLE package.json reparieren (repo-weit, außer node_modules/vendor)
      - name: 🔧 Repair invalid package.json versions (repo-wide)
        shell: bash
        run: |
          echo "🔍 Fixing invalid/missing versions in all package.json..."
          mapfile -t FILES < <(find . -type f -name "package.json" \
            -not -path "*/node_modules/*" -not -path "*/vendor/*")
          for f in "${FILES[@]}"; do
            node - <<'NODE'
            const fs = require('fs');
            const f = process.argv[1];
            try {
              const raw = fs.readFileSync(f, 'utf8');
              const json = JSON.parse(raw);

              // fallback: name/version setzen wenn fehlen/leer
              if (!json.name || json.name === '') json.name = "inspira-workspace";
              if (!json.version || json.version === '' || json.version === null) json.version = "1.0.0";

              fs.writeFileSync(f, JSON.stringify(json, null, 2) + "\n");
              console.log("✅ fixed", f);
            } catch (e) {
              console.log("ℹ️ skip", f, e.message);
            }
NODE
            "$f"
          done

      # 4) Cypress laufen lassen – ohne Installation/Lockfile
      - name: 🧪 Run Cypress tests on Stage (no install)
        uses: cypress-io/github-action@v6
        with:
          install: false                  # 🔴 wichtig: kein npm install / kein Lockfile nötig
          browser: chrome
          # Wir rufen Cypress direkt via npx auf und übergeben baseUrl
          command: npx cypress run --config baseUrl=https://stage.inspira-zentrum.de --record --parallel=false
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5) Meldungen
      - name: 📨 Notify success
        if: success()
        run: echo "✅ Cypress E2E tests completed successfully at $(date)"

      - name: ❌ Notify failure
        if: failure()
        run: echo "❌ Cypress E2E tests failed at $(date)"
