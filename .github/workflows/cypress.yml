name: 🚀 Cypress Tests (Inspira)

on:
  # 🔹 Nur manuell über "Run workflow" im Actions-Tab
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repository auschecken
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node.js Setup
      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Dependencies installieren
      - name: 📦 Install dependencies
        run: npm install

      # 4️⃣ Cypress Tests ausführen
      - name: 🧪 Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          record: true
          parallel: false
          browser: chrome
          config: baseUrl=https://stage.inspira-zentrum.de
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
