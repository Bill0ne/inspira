name: 🚀 Deploy to Inspira Live

on:
  workflow_dispatch:
  push:
    branches:
      - stage-desk

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "145.223.35.233 ssh-ed25519 AAAAC3Nza..." >> ~/.ssh/known_hosts

      - name: 📦 Deploy files via rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete --exclude-from='deploy-exclude.txt'
          path: "./"
          remote_path: "/home/u296731902/domains/inspira-zentrum.de/public_html/"
          remote_host: "145.223.35.233"
          remote_port: 65002
          remote_user: "u296731902"
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ⚙️ Run install + migrate + cache rebuild
        run: |
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
          u296731902@145.223.35.233 << 'EOF'

            cd /home/u296731902/domains/inspira-zentrum.de/public_html

            echo "📦 Composer install..."
            composer install --no-dev --optimize-autoloader --quiet

            echo "📦 Node build..."
            if [ -f package.json ]; then
              yarn install --frozen-lockfile --silent || npm install --silent
              yarn build || npm run build
            fi

            echo "🗄️ Run migrations..."
            php artisan migrate --force

            echo "🧹 Clear & optimize..."
            php artisan optimize:clear
            php artisan view:clear
            php artisan cache:clear
            php artisan config:clear

            echo "🔁 Rebuild plugin/theme caches..."
            rm -f bootstrap/cache/plugins.php

            php artisan cms:plugin:assets:publish
            php artisan cms:theme:assets:publish

            echo "✅ LIVE deployment completed!"
          EOF
