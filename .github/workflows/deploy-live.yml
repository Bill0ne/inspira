name: 🚀 Deploy to Inspira Live

on:
  pull_request:
    types:
      - closed
    branches:
      - main-desk

jobs:
  deploy:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'stage-desk'
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "194.164.74.168 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBk..." >> ~/.ssh/known_hosts

      - name: 🛑 Enable maintenance mode & backup
        run: |
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no u296731902@194.164.74.168 <<'EOF'
          cd /home/u296731902/domains/inspira-zentrum.de/public_html/live-env
          php artisan down || true
          BACKUP_DIR="storage/app/backup/live_$(date +'%Y-%m-%d_%H-%M-%S')"
          mkdir -p "$BACKUP_DIR"
          rsync -a --exclude="storage/app/backup" . "$BACKUP_DIR" >/dev/null 2>&1 || true
          EOF

      - name: 📦 Sync code to Inspira Live
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --exclude-from='deploy-exclude.txt'
          path: ./
          remote_path: /home/u296731902/domains/inspira-zentrum.de/public_html/live-env/
          remote_host: 194.164.74.168
          remote_port: 65002
          remote_user: u296731902
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ⚙️ Composer install & optimize
        run: |
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no u296731902@194.164.74.168 <<'EOF'
          cd /home/u296731902/domains/inspira-zentrum.de/public_html/live-env
          composer install --no-dev --optimize-autoloader --quiet
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:clear
          php artisan up
          EOF

      - name: ✅ Confirm deployment
        run: echo "✅ Inspira Live deployment successful after stage merge!"
